name: Deploy na serwer FTP

# Uruchamia się po każdym pushu do gałęzi main, która zmienia coś w katalogu site/
# oraz ręcznie z zakładki Actions ("Run workflow").
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-ftp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      # Katalog na serwerze, do którego trafia strona (np. public_html). Domyślnie katalog główny konta FTP.
      FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || '.' }}
    steps:
      - name: Sprawdź konfigurację
        id: check
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::warning::Brak sekretów FTP_SERVER / FTP_USERNAME / FTP_PASSWORD – pomijam deploy. Instrukcja w README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - name: Zainstaluj lftp
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Wersje plików CSS i JS (odświeżenie pamięci podręcznej przeglądarek)
        if: steps.check.outputs.ready == 'true'
        run: |
          # "?v=__HASH__" w HTML -> "?v=<8 znaków skrótu zawartości pliku>".
          # Zmienia się tylko wtedy, gdy zmieni się plik, więc przeglądarki pobierają go od nowa dokładnie wtedy, kiedy trzeba.
          for f in css/style.css js/main.js; do
            h=$(sha256sum "site/$f" | cut -c1-8)
            sed -i "s#${f}?v=__HASH__#${f}?v=${h}#g" site/*.html
            echo "$f -> $h"
          done
          if grep -n "__HASH__" site/*.html; then echo "::error::Został nieuzupełniony znacznik __HASH__"; exit 1; fi

      - name: Sprawdź skróty skryptów w Content-Security-Policy
        if: steps.check.outputs.ready == 'true'
        run: |
          # Każdy skrypt wpisany bezpośrednio w HTML (bez src, z wyjątkiem danych JSON-LD) musi mieć
          # swój skrót sha256 w nagłówku CSP w site/.htaccess — inaczej przeglądarka go zablokuje.
          python3 - <<'PY'
          import base64, glob, hashlib, re, sys
          csp = open("site/.htaccess", encoding="utf-8").read()
          bad = []
          for f in sorted(glob.glob("site/*.html")):
              html = open(f, encoding="utf-8").read()
              for attrs, body in re.findall(r"<script(?![^>]*\bsrc=)([^>]*)>(.*?)</script>", html, re.S):
                  if "application/ld+json" in attrs:
                      continue
                  h = "'sha256-" + base64.b64encode(hashlib.sha256(body.encode()).digest()).decode() + "'"
                  print(f, h)
                  if h not in csp:
                      bad.append((f, h))
          for f, h in bad:
              print(f"::error file={f}::Skrypt w {f} ma skrót {h}, którego nie ma w Content-Security-Policy w site/.htaccess. Wpisz go tam zamiast starego.")
          sys.exit(1 if bad else 0)
          PY

      - name: Wyślij pliki na serwer
        if: steps.check.outputs.ready == 'true'
        run: |
          lftp -c "
            set ftp:ssl-allow true;
            set net:max-retries 3;
            set net:timeout 30;
            open -u \"$FTP_USERNAME\" --env-password \"$FTP_SERVER\";
            mirror --reverse --verbose --only-newer --parallel=4 site/ \"$FTP_REMOTE_DIR\";
          "
