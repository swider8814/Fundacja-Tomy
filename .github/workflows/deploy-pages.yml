name: Deploy na GitHub Pages

# Alternatywa dla FTP. Uruchamiana tylko ręcznie (zakładka Actions -> "Run workflow"),
# bo dla prywatnego repozytorium GitHub Pages wymaga płatnego planu.
# Żeby publikować automatycznie po każdym pushu, odkomentuj sekcję "push" poniżej.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["site/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
