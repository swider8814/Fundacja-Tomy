name: Deploy na GitHub Pages

# Alternatywa dla FTP. Uruchamiana tylko ręcznie (zakładka Actions -> "Run workflow"),
# bo dla prywatnego repozytorium GitHub Pages wymaga płatnego planu.
# Żeby publikować automatycznie po każdym pushu, odkomentuj sekcję "push" poniżej.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["site/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Wersje plików CSS i JS (odświeżenie pamięci podręcznej przeglądarek)
        run: |
          # "?v=__HASH__" w HTML -> "?v=<8 znaków skrótu zawartości pliku>".
          # Zmienia się tylko wtedy, gdy zmieni się plik, więc przeglądarki pobierają go od nowa dokładnie wtedy, kiedy trzeba.
          for f in css/style.css js/main.js; do
            h=$(sha256sum "site/$f" | cut -c1-8)
            sed -i "s#${f}?v=__HASH__#${f}?v=${h}#g" site/*.html
            echo "$f -> $h"
          done
          if grep -n "__HASH__" site/*.html; then echo "::error::Został nieuzupełniony znacznik __HASH__"; exit 1; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
